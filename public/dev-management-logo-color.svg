<svg width="680" height="220" viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Logo Management BI, subdomínio da Saphire Sheet</title>
<desc>Ícone de gema facetada em azul e roxo com barras de dados, ao lado do nome Management BI e o texto by Saphire Sheet</desc>
<defs>
