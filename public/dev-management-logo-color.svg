<polygon points="140,70 175,105 195,120" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.4"/>

<text x="230" y="120" font-family="Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="0.3" fill="#1e293b">Management BI</text>
<text x="230" y="150" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#64748b">by Saphire Sheet</text>
