<svg width="820" height="240" viewBox="0 0 820 240" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="wordGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>
  </defs>

  <!-- Icon -->
  <g transform="translate(20,20)">
    <rect x="0" y="0" width="200" height="200" rx="44" fill="url(#iconBg)"/>

    <!-- code brackets -->
    <polyline points="70,62 42,100 70,138" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="130,62 158,100 130,138" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- ascending bars (BI data) -->
    <rect x="80" y="112" width="14" height="30" rx="4" fill="#FFFFFF"/>
    <rect x="100" y="94" width="14" height="48" rx="4" fill="#FFFFFF"/>
    <rect x="120" y="70" width="14" height="72" rx="4" fill="#FFFFFF"/>

    <!-- trend dot -->
    <circle cx="127" cy="62" r="6" fill="#FFFFFF"/>
  </g>

  <!-- Wordmark -->
  <text x="250" y="112" font-family="Helvetica, Arial, sans-serif" font-weight="800" font-size="46" letter-spacing="0.5" fill="url(#wordGrad)">DEV MANAGEMENT</text>
  <text x="252" y="148" font-family="Helvetica, Arial, sans-serif" font-weight="500" font-size="24" letter-spacing="3" fill="#0891B2">DEVELOPMENT BI</text>

  <!-- underline accent -->
  <rect x="252" y="164" width="220" height="4" rx="2" fill="#06B6D4" opacity="0.6"/>
</svg>
