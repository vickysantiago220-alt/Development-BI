<polygon points="105,105 175,105 140,190" />
</clipPath>
</defs>

<polygon points="140,70 105,105 175,105" fill="#93c5fd"/>
<polygon points="105,105 85,120 140,190" fill="#2563eb"/>
<polygon points="175,105 195,120 140,190" fill="#7c3aed"/>
